<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Maison Fleur</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin_login.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap"
          rel="stylesheet">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <p class="eyebrow">MAISON FLEUR</p>

            <h1>Welcome Back</h1>

            <p class="subtitle">Administrator Access</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_login') }}">

                <div class="form-group">
                    <label for="email">EMAIL ADDRESS</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your admin email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">PASSWORD</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">SIGN IN</button>

            </form>

            <a href="{{ url_for('home') }}" class="back-link">
                Return to Maison Fleur
            </a>

        </div>

    </div>

</body>
</html>
